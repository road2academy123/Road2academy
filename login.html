<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Road to Academy</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#071d3b,#123b7a);
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:bold;
    margin-bottom:25px;
}

.logo span{
    color:#e0a32d;
}

.card{
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.card h1{
    text-align:center;
    color:#172033;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:28px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#374151;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:18px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#123b7a;
}

button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:8px;
    background:#123b7a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0d2f62;
}

.message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    font-size:14px;
}

.signup{
    text-align:center;
    margin-top:20px;
    color:#667085;
}

.signup a{
    color:#123b7a;
    font-weight:bold;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#667085;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Road to <span>Academy</span>
</div>

<div class="card">

<h1>Welcome Back</h1>

<p class="subtitle">
Login to continue your preparation.
</p>

<form id="loginForm">

<label>Email</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button type="submit">
Login
</button>

</form>

<div class="message" id="message"></div>

<div class="signup">
Don't have an account?
<a href="signup.html">Create Account</a>
</div>

<a href="https://road2academy.neocities.org/" class="back">
← Back to Road to Academy
</a>

</div>

</div>


<script type="module">

import { createClient }
from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


// ======================================
// PUT YOUR SUPABASE DETAILS HERE
// ======================================

const SUPABASE_URL = "https://egjrkxdyehwbzgoppiqk.supabase.co";

const SUPABASE_KEY = "sb_publishable_nc_Xv85AMQrmgIlDEWD8CA_aSeMk-yv";


// Create Supabase client

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// Login

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");


form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    message.style.color = "#123b7a";
    message.textContent = "Logging in...";


    const { data, error } =
        await supabase.auth.signInWithPassword({

            email: email,

            password: password

        });


    if(error){

        message.style.color = "red";

        message.textContent =
            error.message;

        return;
    }


    message.style.color = "green";

    message.textContent =
        "Login successful!";


    setTimeout(() => {

        window.location.href =
            "dashboard.html";

    },1000);

});

</script>

</body>
</html>
