<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDA Test Series | Road 2 Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #111827;
}

header {
  background: #071a3d;
  color: white;
  padding: 18px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  color: #f5c542;
  font-size: 22px;
  font-weight: bold;
}

.back {
  color: white;
  text-decoration: none;
}

.container {
  max-width: 1000px;
  margin: 35px auto;
  padding: 0 20px;
}

.heading {
  margin-bottom: 25px;
}

.heading h1 {
  color: #071a3d;
  margin-bottom: 8px;
}

.heading p {
  color: #666;
  line-height: 1.5;
}

.account {
  margin-top: 8px;
  font-size: 13px;
}

.tests {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.test-card {
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 4px 15px #00000012;
  min-width: 0;
}

.badge {
  display: inline-block;
  background: #eef3ff;
  color: #071a3d;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 12px;
}

.test-card h2 {
  color: #071a3d;
  font-size: 20px;
  margin-bottom: 10px;
  overflow-wrap: anywhere;
}

.description {
  color: #666;
  line-height: 1.6;
  margin-bottom: 18px;
  overflow-wrap: anywhere;
}

.details {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  color: #555;
  font-size: 14px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  color: #071a3d;
  margin-bottom: 16px;
}

.start {
  display: block;
  width: 100%;
  text-align: center;
  background: #071a3d;
  color: white;
  text-decoration: none;
  padding: 13px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.2s;
}

.start:hover {
  background: #102c61;
}

.empty {
  background: white;
  padding: 40px 20px;
  border-radius: 12px;
  text-align: center;
  color: #666;
  grid-column: 1 / -1;
  line-height: 1.6;
}

.error {
  background: #fff0f0;
  color: #b00020;
  padding: 16px;
  border-radius: 10px;
  grid-column: 1 / -1;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

@media (max-width: 700px) {
  .tests {
    grid-template-columns: 1fr;
  }

  .container {
    margin: 24px auto;
  }

  header {
    padding: 16px;
  }

  .logo {
    font-size: 18px;
  }

  .test-card {
    padding: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ROAD 2 ACADEMY</div>
  <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<main class="container">

  <div class="heading">
    <h1>NDA Test Series</h1>
    <p>Practice NDA-level tests and track your performance.</p>
    <p id="accountInfo" class="account">Checking login...</p>
  </div>

  <div class="tests" id="tests">
    <div class="empty">Loading tests...</div>
  </div>

</main>

<script>
"use strict";

/* ============ SUPABASE CONFIGURATION ============ */

const SUPABASE_URL =
  "https://egjrkxdyehwbzgoppiqk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nc_Xv85AMQrmgIlDEWD8CA_aSeMk-yv";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ============ HELPERS ============ */

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function isFree(test) {
  return Number(test.price_inr ?? 0) <= 0;
}

function money(amount) {
  return new Intl.NumberFormat("en-IN", {
    style: "currency",
    currency: "INR",
    maximumFractionDigits: 2
  }).format(Number(amount || 0));
}

function testURL(testId) {
  return "test-details.html?test=" +
    encodeURIComponent(testId);
}

/* ============ RENDER TESTS ============ */

function renderTests(tests) {
  const container = document.getElementById("tests");

  container.innerHTML = "";

  if (!tests || tests.length === 0) {
    container.innerHTML = `
      <div class="empty">
        No NDA tests are published yet.
        Please check again later.
      </div>
    `;
    return;
  }

  tests.forEach(test => {
    const card = document.createElement("article");
    card.className = "test-card";

    const priceLabel = isFree(test)
      ? "FREE"
      : money(test.price_inr);

    card.innerHTML = `
      <div class="badge">
        ${escapeHTML(test.subject || "NDA")}
      </div>

      <h2>${escapeHTML(test.title || "Untitled Test")}</h2>

      <p class="description">
        ${escapeHTML(
          test.description || "NDA practice test."
        )}
      </p>

      <div class="details">
        <span>⏱ ${escapeHTML(test.duration_minutes ?? "—")} min</span>
        <span>📝 ${escapeHTML(test.total_marks ?? "—")} marks</span>
        <span>➖ ${escapeHTML(test.negative_marks ?? 0)} negative</span>
      </div>

      <div class="price">${priceLabel}</div>

      <a class="start" href="${testURL(test.id)}">
        View Test Details →
      </a>
    `;

    container.appendChild(card);
  });
}

/* ============ LOAD TESTS ============ */

async function loadTests() {
  const container = document.getElementById("tests");

  try {
    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    if (!sessionData.session) {
      window.location.href = "login.html";
      return;
    }

    const currentUser = sessionData.session.user;

    document.getElementById("accountInfo").textContent =
      "Logged in as " + (currentUser.email || "student");

    const {
      data: tests,
      error
    } = await supabaseClient
      .from("tests")
      .select(`
        id,
        title,
        exam,
        subject,
        description,
        duration_minutes,
        total_marks,
        negative_marks,
        price_inr
      `)
      .eq("exam", "NDA")
      .eq("is_published", true)
      .order("id", { ascending: true });

    if (error) {
      throw error;
    }

    renderTests(tests || []);

  } catch (error) {
    console.error("Failed to load NDA tests:", error);

    container.innerHTML = `
      <div class="error">
        Unable to load tests.
        ${escapeHTML(error.message || "Please try again later.")}
      </div>
    `;
  }
}

/* ============ AUTH STATE ============ */

supabaseClient.auth.onAuthStateChange(event => {
  if (event === "SIGNED_OUT") {
    window.location.href = "login.html";
  }
});

/* ============ START ============ */

loadTests();
</script>

</body>
</html>
