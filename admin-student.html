<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Student Details — Road to Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #071a3d;
}

header {
    background: #071a3d;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

header h1 {
    margin: 0;
    font-size: 21px;
}

.header-buttons {
    display: flex;
    gap: 10px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    font-weight: bold;
    cursor: pointer;
}

.back-btn {
    background: #dce5f7;
    color: #071a3d;
}

.logout-btn {
    background: #e74c3c;
    color: white;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 22px;
    box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.profile-name {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
}

.email {
    color: #69758c;
}

.joined {
    margin-top: 8px;
    color: #69758c;
    font-size: 14px;
}

.stats-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));
    gap: 16px;
}

.stat {
    border: 1px solid #e1e6ef;
    border-radius: 14px;
    padding: 18px;
}

.stat-title {
    color: #69758c;
    font-size: 13px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 25px;
    font-weight: bold;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #e5e9f0;
    text-align: left;
}

th {
    background: #f3f6fb;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 8px;
    background: #e8eefc;
    font-size: 12px;
    font-weight: bold;
}

.loading,
.error {
    background: white;
    padding: 35px;
    border-radius: 18px;
    text-align: center;
}

.error {
    color: #c0392b;
}

</style>

</head>

<body>

<header>

    <h1>👤 STUDENT DETAILS</h1>

    <div class="header-buttons">

        <button
            class="back-btn"
            onclick="location.href='admin-students.html'"
        >
            ← Students
        </button>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<div class="container">

    <div
        id="loading"
        class="loading"
    >
        Loading student...
    </div>

    <div
        id="error"
        class="error"
        style="display:none;"
    ></div>


    <div
        id="content"
        style="display:none;"
    >

        <!-- PROFILE -->

        <div class="card">

            <div
                id="studentName"
                class="profile-name"
            ></div>

            <div
                id="studentEmail"
                class="email"
            ></div>

            <div
                id="joined"
                class="joined"
            ></div>

        </div>


        <!-- STATS -->

        <div class="card">

            <h2>📊 Performance</h2>

            <div class="stats-grid">

                <div class="stat">

                    <div class="stat-title">
                        Tests Taken
                    </div>

                    <div
                        id="testsTaken"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Average Score
                    </div>

                    <div
                        id="averageScore"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Best Score
                    </div>

                    <div
                        id="bestScore"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Average Accuracy
                    </div>

                    <div
                        id="averageAccuracy"
                        class="stat-value"
                    >
                        0%
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Correct
                    </div>

                    <div
                        id="correct"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Wrong
                    </div>

                    <div
                        id="wrong"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Unanswered
                    </div>

                    <div
                        id="unanswered"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>

            </div>

        </div>


        <!-- ATTEMPT HISTORY -->

        <div class="card">

            <h2>📝 Test History</h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Test</th>
                            <th>Exam</th>
                            <th>Score</th>
                            <th>Accuracy</th>
                            <th>Correct</th>
                            <th>Wrong</th>
                            <th>Unanswered</th>
                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody id="attempts"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://egjrkxdyehwbzgoppiqk.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_nc_Xv85AMQrmgIlDEWD8CA_aSeMk-yv";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const params =
    new URLSearchParams(
        window.location.search
    );


const userId =
    params.get("user");


async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";

}


async function loadStudent() {

    if (!userId) {

        showError(
            "No student ID was provided."
        );

        return;

    }


    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            "login.html";

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient.rpc(
            "get_admin_student_details",
            {
                p_user_id: userId
            }
        );


    if (error) {

        console.error(error);

        showError(
            "Student loading error: " +
            error.message
        );

        return;

    }


    renderStudent(data);

}


function renderStudent(data) {

    const profile =
        data.profile;

    const stats =
        data.stats;


    document.getElementById(
        "studentName"
    ).innerText =
        profile.name;


    document.getElementById(
        "studentEmail"
    ).innerText =
        profile.email || "";


    document.getElementById(
        "joined"
    ).innerText =
        "Joined: " +
        new Date(
            profile.joined_at
        ).toLocaleDateString();


    document.getElementById(
        "testsTaken"
    ).innerText =
        stats.tests_taken;


    document.getElementById(
        "averageScore"
    ).innerText =
        stats.average_score;


    document.getElementById(
        "bestScore"
    ).innerText =
        stats.best_score;


    document.getElementById(
        "averageAccuracy"
    ).innerText =
        stats.average_accuracy + "%";


    document.getElementById(
        "correct"
    ).innerText =
        stats.correct_answers;


    document.getElementById(
        "wrong"
    ).innerText =
        stats.wrong_answers;


    document.getElementById(
        "unanswered"
    ).innerText =
        stats.unanswered;


    const table =
        document.getElementById(
            "attempts"
        );

    table.innerHTML = "";


    if (!data.attempts.length) {

        table.innerHTML = `
            <tr>
                <td colspan="8">
                    No submitted tests yet.
                </td>
            </tr>
        `;

    } else {

        data.attempts.forEach(
            attempt => {

                table.innerHTML += `

                    <tr>

                        <td>
                            ${escapeHtml(
                                attempt.title
                            )}
                        </td>

                        <td>
                            <span class="badge">
                                ${escapeHtml(
                                    attempt.exam
                                )}
                            </span>
                        </td>

                        <td>
                            ${attempt.score}
                        </td>

                        <td>
                            ${attempt.accuracy}%
                        </td>

                        <td>
                            ${attempt.correct}
                        </td>

                        <td>
                            ${attempt.wrong}
                        </td>

                        <td>
                            ${attempt.unanswered}
                        </td>

                        <td>
                            ${new Date(
                                attempt.submitted_at
                            ).toLocaleString()}
                        </td>

                    </tr>

                `;

            }
        );

    }


    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "content"
    ).style.display = "block";

}


function showError(message) {

    document.getElementById(
        "loading"
    ).style.display = "none";


    const error =
        document.getElementById(
            "error"
        );

    error.style.display = "block";

    error.innerText = message;

}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


loadStudent();

</script>

</body>

</html>
