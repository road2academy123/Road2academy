<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Road to Academy</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#071d3b,#123b7a);
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
}

.logo{
    text-align:center;
    color:white;
    font-size:28px;
    font-weight:800;
    margin-bottom:25px;
}

.logo span{
    color:#e0a32d;
}

.card{
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.card h1{
    text-align:center;
    color:#172033;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:28px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#374151;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:18px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#123b7a;
}

button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:8px;
    background:#123b7a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0d2f62;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:15px;
    min-height:22px;
    font-size:14px;
    line-height:1.5;
}

.login{
    text-align:center;
    margin-top:20px;
    color:#667085;
}

.login a{
    color:#123b7a;
    font-weight:bold;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#667085;
    text-decoration:none;
}

</style>

</head>


<body>


<div class="container">


<div class="logo">
Road to <span>Academy</span>
</div>


<div class="card">

<h1>Create Account</h1>

<p class="subtitle">
Start your NDA & CDS preparation.
</p>


<form id="signupForm">


<label for="name">
Full Name
</label>

<input
    type="text"
    id="name"
    placeholder="Enter your name"
    required
>


<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>


<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    placeholder="Minimum 6 characters"
    minlength="6"
    required
>


<label for="confirmPassword">
Confirm Password
</label>

<input
    type="password"
    id="confirmPassword"
    placeholder="Enter password again"
    minlength="6"
    required
>


<button
    type="submit"
    id="signupButton"
>
Create Account
</button>


</form>


<div
    class="message"
    id="message">
</div>


<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>


<a
    href="index.html"
    class="back"
>
← Back to Road to Academy
</a>


</div>

</div>


<script type="module">


import { createClient }

from

'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


// ============================================
// YOUR SUPABASE PROJECT DETAILS
// ============================================

const SUPABASE_URL =
"https://egjrkxdyehwbzgoppiqk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nc_Xv85AMQrmgIlDEWD8CA_aSeMk-yv";


// ============================================
// CONNECT TO SUPABASE
// ============================================

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ============================================
// FORM
// ============================================

const form =
document.getElementById("signupForm");

const message =
document.getElementById("message");

const button =
document.getElementById("signupButton");


form.addEventListener("submit", async function(e){

    e.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    // Check passwords

    if(password !== confirmPassword){

        message.style.color = "red";

        message.textContent =
            "Passwords do not match.";

        return;
    }


    if(password.length < 6){

        message.style.color = "red";

        message.textContent =
            "Password must contain at least 6 characters.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Creating Account...";


    message.style.color = "#123b7a";

    message.textContent =
        "Please wait...";


    // ========================================
    // CREATE SUPABASE ACCOUNT
    // ========================================

    const { data, error } =

        await supabase.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    full_name: name

                }

            }

        });


    // ========================================
    // ERROR
    // ========================================

    if(error){

        message.style.color = "red";

        message.textContent =
            error.message;

        button.disabled = false;

        button.textContent =
            "Create Account";

        return;
    }


    // ========================================
    // SUCCESS
    // ========================================

    message.style.color = "green";


    if(data.session){

        message.textContent =
            "Account created successfully! Redirecting...";


        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        },1200);

    }

    else{

        message.textContent =
            "Account created! Check your email to verify your account.";

        button.disabled = false;

        button.textContent =
            "Create Account";

    }

});


</script>


</body>
</html>
