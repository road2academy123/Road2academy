<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Test | Road to Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    color: #111827;
}

/* =========================================================
   HEADER
========================================================= */

header {
    background: #071a3d;
    color: white;

    padding: 16px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #f5c542;
}

.timer {
    background: #f5c542;
    color: #071a3d;

    padding: 10px 16px;

    border-radius: 8px;

    font-weight: bold;

    min-width: 75px;
    text-align: center;
}

/* =========================================================
   CONTAINER
========================================================= */

.container {
    max-width: 900px;

    margin: 25px auto;

    padding: 0 15px;
}

/* =========================================================
   TEST INFO
========================================================= */

.test-info {
    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-bottom: 20px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.test-info h1 {
    color: #071a3d;

    margin-bottom: 8px;
}

/* =========================================================
   QUESTION CARD
========================================================= */

.question-card {
    background: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.question-number {
    color: #777;

    margin-bottom: 12px;

    font-weight: bold;
}

.question-text {
    font-size: 20px;

    font-weight: bold;

    line-height: 1.5;

    margin-bottom: 25px;
}

/* =========================================================
   OPTIONS
========================================================= */

.option {
    display: block;

    border: 2px solid #ddd;

    padding: 15px;

    border-radius: 10px;

    margin-bottom: 12px;

    cursor: pointer;

    transition: 0.2s;
}

.option:hover {
    border-color: #071a3d;
}

.option.selected {
    border-color: #071a3d;

    background: #eef3ff;
}

.option input {
    margin-right: 10px;
}

/* =========================================================
   SAVE STATUS
========================================================= */

.save-status {
    margin-top: 15px;

    font-size: 13px;

    color: #6b7280;

    min-height: 18px;
}

.save-status.saved {
    color: #15803d;
}

.save-status.error {
    color: #dc2626;
}

/* =========================================================
   BUTTONS
========================================================= */

.buttons {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    margin-top: 25px;

    gap: 10px;
}

button {
    border: none;

    padding: 12px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;

    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.6;

    cursor: not-allowed;

    transform: none;
}

.prev {
    background: #ddd;

    color: #111827;
}

.next {
    background: #071a3d;

    color: white;
}

.submit {
    background: #d62828;

    color: white;
}

.unattempt {
    background: #f3f4f6;

    color: #374151;

    border: 1px solid #d1d5db;
}

.unattempt:hover {
    background: #e5e7eb;
}

.review {
    background: #7c3aed;

    color: white;
}

.review.marked {
    background: #5b21b6;
}

/* =========================================================
   QUESTION PALETTE
========================================================= */

.palette-section {
    margin-top: 30px;

    padding-top: 20px;

    border-top: 1px solid #eee;
}

.palette-title {
    margin-bottom: 12px;

    font-weight: bold;

    color: #071a3d;
}

.palette {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.palette button {
    width: 40px;

    height: 40px;

    padding: 0;

    background: #eee;

    color: #111827;
}

.palette button.answered {
    background: #071a3d;

    color: white;
}

.palette button.reviewed {
    background: #7c3aed;

    color: white;
}

.palette button.answered.reviewed {
    background: linear-gradient(
        135deg,
        #071a3d 50%,
        #7c3aed 50%
    );

    color: white;
}

.palette button.current {
    outline: 3px solid #f5c542;

    outline-offset: 1px;
}

/* =========================================================
   PALETTE LEGEND
========================================================= */

.palette-info {
    display: flex;

    flex-wrap: wrap;

    gap: 14px;

    margin-top: 15px;

    font-size: 13px;

    color: #555;
}

.palette-info span {
    display: flex;

    align-items: center;

    gap: 5px;
}

.legend-box {
    width: 14px;

    height: 14px;

    border-radius: 3px;

    display: inline-block;
}

.legend-unanswered {
    background: #eee;

    border: 1px solid #ccc;
}

.legend-answered {
    background: #071a3d;
}

.legend-review {
    background: #7c3aed;
}

.legend-both {
    background: linear-gradient(
        135deg,
        #071a3d 50%,
        #7c3aed 50%
    );
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    text-align: center;

    padding: 50px;

    font-size: 20px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    header {
        padding: 13px 15px;
    }

    .logo {
        font-size: 17px;
    }

    .timer {
        padding: 8px 10px;

        font-size: 14px;
    }

    .container {
        margin: 15px auto;

        padding: 0 10px;
    }

    .question-card {
        padding: 18px;
    }

    .question-text {
        font-size: 17px;
    }

    .buttons {
        display: grid;

        grid-template-columns:
            1fr 1fr;

        width: 100%;
    }

    .buttons button {
        width: 100%;
    }
.restart{
    background:#f3f4f6;
    color:#1f2937;
    border:1px solid #d1d5db;
    padding:12px 18px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.restart:hover{
    background:#e5e7eb;
}
    .submit {
        grid-column: 1 / -1;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        ROAD TO ACADEMY
    </div>

    <div
        class="timer"
        id="timer"
    >
        --:--
    </div>

</header>


<div class="container">


    <div
        id="loading"
        class="loading"
    >
        Loading test...
    </div>


    <div
        id="testArea"
        style="display:none;"
    >


        <div class="test-info">

            <h1 id="testTitle">
                Test
            </h1>

            <p id="testDescription"></p>

        </div>


        <div class="question-card">


            <div
                class="question-number"
                id="questionNumber"
            ></div>


            <div
                class="question-text"
                id="questionText"
            ></div>


            <div id="options"></div>


            <div
                class="save-status"
                id="saveStatus"
            ></div>


            <!-- =================================================
                 NAVIGATION BUTTONS
            ================================================= -->

            <div class="buttons">

                <button
                    class="prev"
                    onclick="previousQuestion()"
                >
                    ← Previous
                </button>


                <button
                    class="unattempt"
                    id="unattemptButton"
                    onclick="unattemptQuestion()"
                >
                    Clear Answer
                </button>


                <button
                    class="review"
                    id="reviewButton"
                    onclick="toggleReview()"
                >
                    🔖 Mark for Review
                </button>


                <button
                    class="next"
                    id="nextButton"
                    onclick="nextQuestion()"
                >
                    Next →
                </button>

<button class="restart" onclick="restartTest()">Restart Test</button>

                <button
                    class="submit"
                    onclick="submitTest()"
                >
                    Submit Test
                </button>

            </div>


            <!-- =================================================
                 QUESTION PALETTE
            ================================================= -->

            <div class="palette-section">

                <div class="palette-title">
                    Question Palette
                </div>


                <div
                    class="palette"
                    id="palette"
                ></div>


                <div class="palette-info">

                    <span>
                        <span
                            class="legend-box legend-unanswered"
                        ></span>
                        Unanswered
                    </span>


                    <span>
                        <span
                            class="legend-box legend-answered"
                        ></span>
                        Answered
                    </span>


                    <span>
                        <span
                            class="legend-box legend-review"
                        ></span>
                        Review
                    </span>


                    <span>
                        <span
                            class="legend-box legend-both"
                        ></span>
                        Answered + Review
                    </span>

                </div>

            </div>


        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://egjrkxdyehwbzgoppiqk.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_nc_Xv85AMQrmgIlDEWD8CA_aSeMk-yv";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let test = null;

let questions = [];

let currentQuestion = 0;

let answers = {};

let markedForReview = {};

let attemptId = null;

let serverStartedAt = null;

let durationSeconds = 0;

let timerInterval = null;

let submitting = false;


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const testId =
    params.get("test") || "1";


/* =========================================================
   START
========================================================= */

async function startTest() {

    try {

        const {
            data: {
                session
            }
        } =
        await supabaseClient.auth.getSession();


        if (!session) {

            window.location.href =
                "login.html";

            return;

        }


        await loadTest();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "loading"
        ).textContent =
            "Unable to start test.";

    }

}


/* =========================================================
   LOAD TEST
========================================================= */

async function loadTest() {

    /* -----------------------------------------
       LOAD TEST
    ----------------------------------------- */

    const {
        data: testData,
        error: testError
    } =
    await supabaseClient
        .from("tests")
        .select("*")
        .eq("id", testId)
        .eq("is_published", true)
        .single();


    if (testError) {

        console.error(testError);

        document.getElementById(
            "loading"
        ).textContent =
            "Unable to load test.";

        return;

    }


    test = testData;


    /* -----------------------------------------
       LOAD PUBLIC QUESTIONS
    ----------------------------------------- */

    const {
        data: questionData,
        error: questionError
    } =
    await supabaseClient
        .from("test_questions_public")
        .select("*")
        .eq("test_id", testId)
        .order(
            "question_number",
            {
                ascending: true
            }
        );


    if (questionError) {

        console.error(questionError);

        document.getElementById(
            "loading"
        ).textContent =
            "Unable to load questions.";

        return;

    }


    questions =
        questionData || [];


    if (questions.length === 0) {

        document.getElementById(
            "loading"
        ).textContent =
            "This test has no questions yet.";

        return;

    }


    /* -----------------------------------------
       TEST INFORMATION
    ----------------------------------------- */

    document.getElementById(
        "testTitle"
    ).textContent =
        test.title;


    document.getElementById(
        "testDescription"
    ).textContent =
        test.description || "";


    /* -----------------------------------------
       START / RESUME ATTEMPT
    ----------------------------------------- */

    const {
        data: attemptData,
        error: attemptError
    } =
    await supabaseClient.rpc(
        "start_test_attempt",
        {
            p_test_id:
                Number(testId)
        }
    );


    if (attemptError) {

        console.error(attemptError);

        document.getElementById(
            "loading"
        ).innerHTML =
            "Unable to start test.<br><br>" +
            escapeHtml(
                attemptError.message
            );

        return;

    }


    console.log(
        "Server attempt:",
        attemptData
    );


    attemptId =
        attemptData.attempt_id;


    serverStartedAt =
        new Date(
            attemptData.started_at
        ).getTime();


    durationSeconds =
        Number(
            attemptData.duration_minutes
        ) * 60;


    /* -----------------------------------------
       LOAD SAVED ANSWERS
    ----------------------------------------- */

    await loadSavedAnswers();


    /* -----------------------------------------
       START TIMER
    ----------------------------------------- */

    startTimer();


    /* -----------------------------------------
       SHOW TEST
    ----------------------------------------- */

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "testArea"
    ).style.display =
        "block";


    renderQuestion();

}


/* =========================================================
   LOAD SAVED ANSWERS
========================================================= */

async function loadSavedAnswers() {

    try {

        setSaveStatus(
            "Restoring saved answers..."
        );


        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "get_attempt_responses",
            {
                p_attempt_id:
                    Number(attemptId)
            }
        );


        if (error) {

            console.error(
                "Load answers error:",
                error
            );

            setSaveStatus(
                "Could not restore saved answers.",
                "error"
            );

            return;

        }


        if (
            data &&
            typeof data === "object"
        ) {

            answers = data;

        }

        else {

            answers = {};

        }


        console.log(
            "Restored answers:",
            answers
        );


        const savedCount =
            questions.filter(
                q =>
                    answers[q.id]
            ).length;


        if (
            savedCount > 0
        ) {

            setSaveStatus(
                `${savedCount} answer(s) restored.`,
                "saved"
            );

        }

        else {

            setSaveStatus(
                "Answers will be saved automatically."
            );

        }

    }

    catch (error) {

        console.error(error);

        setSaveStatus(
            "Could not restore saved answers.",
            "error"
        );

    }

}


/* =========================================================
   SAVE ANSWER
========================================================= */

async function saveAnswer(
    questionId,
    selectedAnswer
) {

    setSaveStatus(
        "Saving..."
    );


    try {

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "save_attempt_answer",
            {
                p_attempt_id:
                    Number(attemptId),

                p_question_id:
                    Number(questionId),

                p_selected_answer:
                    selectedAnswer
            }
        );


        if (error) {

            console.error(
                "Save answer error:",
                error
            );

            setSaveStatus(
                "Could not save answer.",
                "error"
            );

            return false;

        }


        console.log(
            "Answer saved:",
            data
        );


        setSaveStatus(
            "✓ Answer saved",
            "saved"
        );


        return true;

    }

    catch (error) {

        console.error(error);

        setSaveStatus(
            "Could not save answer.",
            "error"
        );

        return false;

    }

}


/* =========================================================
   SAVE STATUS
========================================================= */

function setSaveStatus(
    message,
    type = ""
) {

    const element =
        document.getElementById(
            "saveStatus"
        );


    element.textContent =
        message;


    element.className =
        "save-status";


    if (type) {

        element.classList.add(
            type
        );

    }

}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion() {

    const q =
        questions[currentQuestion];


    if (!q) {

        return;

    }


    /* -----------------------------------------
       QUESTION NUMBER
    ----------------------------------------- */

    document.getElementById(
        "questionNumber"
    ).textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;


    /* -----------------------------------------
       QUESTION TEXT
    ----------------------------------------- */

    document.getElementById(
        "questionText"
    ).textContent =
        q.question_text;


    /* -----------------------------------------
       OPTIONS
    ----------------------------------------- */

    const optionsContainer =
        document.getElementById(
            "options"
        );


    optionsContainer.innerHTML =
        "";


    const options = [

        ["A", q.option_a],

        ["B", q.option_b],

        ["C", q.option_c],

        ["D", q.option_d]

    ];


    options.forEach(
        ([letter, text]) => {


            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "option";


            if (
                answers[q.id] === letter
            ) {

                label.classList.add(
                    "selected"
                );

            }


            label.innerHTML = `

                <input
                    type="radio"
                    name="answer"
                    value="${letter}"
                    ${
                        answers[q.id] === letter
                        ? "checked"
                        : ""
                    }
                >

                <strong>
                    ${letter}.
                </strong>

                ${escapeHtml(text)}

            `;


            label
                .querySelector("input")
                .addEventListener(
                    "change",
                    async function() {


                        const selected =
                            this.value;


                        /* --------------------------------
                           UPDATE LOCAL ANSWER
                        -------------------------------- */

                        answers[q.id] =
                            selected;


                        renderQuestion();


                        /* --------------------------------
                           SAVE TO SUPABASE
                        -------------------------------- */

                        await saveAnswer(
                            q.id,
                            selected
                        );

                    }
                );


            optionsContainer
                .appendChild(label);

        }
    );


    /* -----------------------------------------
       REVIEW BUTTON
    ----------------------------------------- */

    const reviewButton =
        document.getElementById(
            "reviewButton"
        );


    if (
        markedForReview[q.id]
    ) {

        reviewButton.textContent =
            "🔖 Remove Review";

        reviewButton.classList.add(
            "marked"
        );

    }

    else {

        reviewButton.textContent =
            "🔖 Mark for Review";

        reviewButton.classList.remove(
            "marked"
        );

    }


    /* -----------------------------------------
       CLEAR ANSWER BUTTON
    ----------------------------------------- */

    const unattemptButton =
        document.getElementById(
            "unattemptButton"
        );


    unattemptButton.disabled =
        !answers[q.id];


    /* -----------------------------------------
       UPDATE NAVIGATION
    ----------------------------------------- */

    updateButtons();


    /* -----------------------------------------
       UPDATE PALETTE
    ----------------------------------------- */

    renderPalette();

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   UNATTEMPT / CLEAR ANSWER
========================================================= */

async function unattemptQuestion() {

    const q =
        questions[currentQuestion];


    if (
        !q ||
        submitting
    ) {

        return;

    }


    if (
        !answers[q.id]
    ) {

        return;

    }


    /* -----------------------------------------
       REMOVE LOCAL ANSWER
    ----------------------------------------- */

    delete answers[q.id];


    /* -----------------------------------------
       UPDATE UI
    ----------------------------------------- */

    renderQuestion();


    /* -----------------------------------------
       SAVE EMPTY ANSWER
    ----------------------------------------- */

    await saveAnswer(
        q.id,
        ""
    );

}


/* =========================================================
   MARK FOR REVIEW
========================================================= */

function toggleReview() {

    const q =
        questions[currentQuestion];


    if (!q) {

        return;

    }


    if (
        markedForReview[q.id]
    ) {

        delete markedForReview[q.id];

    }

    else {

        markedForReview[q.id] =
            true;

    }


    renderQuestion();

}


/* =========================================================
   BUTTONS
========================================================= */

function updateButtons() {

    const nextButton =
        document.getElementById(
            "nextButton"
        );


    const prevButton =
        document.querySelector(
            ".prev"
        );


    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.style.display =
            "none";

    }

    else {

        nextButton.style.display =
            "block";

    }


    if (
        currentQuestion === 0
    ) {

        prevButton.disabled =
            true;

    }

    else {

        prevButton.disabled =
            false;

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion() {

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        renderQuestion();

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousQuestion() {

    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        renderQuestion();

    }

}


/* =========================================================
   QUESTION PALETTE
========================================================= */

function renderPalette() {

    const palette =
        document.getElementById(
            "palette"
        );


    palette.innerHTML =
        "";


    questions.forEach(
        (q, index) => {


            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                index + 1;


            /* -----------------------------------------
               ANSWERED
            ----------------------------------------- */

            if (
                answers[q.id]
            ) {

                button.classList.add(
                    "answered"
                );

            }


            /* -----------------------------------------
               REVIEW
            ----------------------------------------- */

            if (
                markedForReview[q.id]
            ) {

                button.classList.add(
                    "reviewed"
                );

            }


            /* -----------------------------------------
               CURRENT
            ----------------------------------------- */

            if (
                index === currentQuestion
            ) {

                button.classList.add(
                    "current"
                );

            }


            button.onclick =
                function() {

                    currentQuestion =
                        index;

                    renderQuestion();

                };


            palette.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            1000
        );

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer() {

    if (
        !serverStartedAt ||
        !durationSeconds
    ) {

        return;

    }


    const now =
        Date.now();


    const elapsedSeconds =
        Math.floor(
            (
                now -
                serverStartedAt
            ) / 1000
        );


    const remaining =
        Math.max(
            0,
            durationSeconds -
            elapsedSeconds
        );


    const minutes =
        Math.floor(
            remaining / 60
        );


    const seconds =
        remaining % 60;


    document.getElementById(
        "timer"
    ).textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;


    /* -----------------------------------------
       TIME EXPIRED
    ----------------------------------------- */

    if (
        remaining <= 0 &&
        !submitting
    ) {

        clearInterval(
            timerInterval
        );


        alert(
            "Time is up! Your test will be submitted."
        );


        submitTest(true);

    }

}


/* =========================================================
   SUBMIT TEST
========================================================= */

async function submitTest(
    autoSubmit = false
) {

    if (submitting) {

        return;

    }


    /* -----------------------------------------
       CONFIRMATION
    ----------------------------------------- */

    if (!autoSubmit) {

        const answered =
            questions.filter(
                q =>
                    answers[q.id]
            ).length;


        const unanswered =
            questions.length -
            answered;


        const reviewed =
            questions.filter(
                q =>
                    markedForReview[q.id]
            ).length;


        const confirmSubmit =
            confirm(
                `Submit test?\n\n` +

                `Answered: ${answered}\n` +

                `Unanswered: ${unanswered}\n` +

                `Marked for Review: ${reviewed}`
            );


        if (!confirmSubmit) {

            return;

        }

    }
async function restartTest(){

    if(!attemptId){
        alert("No active attempt found.");
        return;
    }

    const confirmed = confirm(
        "Restart this test?\n\nYour current attempt and saved answers will be deleted and a fresh attempt will start."
    );

    if(!confirmed) return;

    try{

        const { data, error } = await supabase.rpc(
            "restart_test_attempt",
            {
                p_attempt_id: attemptId
            }
        );

        if(error){
            console.error(error);
            alert(error.message || "Could not restart the test.");
            return;
        }

        attemptId = data.attempt_id;
        serverStartedAt = data.started_at;
        durationSeconds = data.duration_minutes * 60;

        answers = {};
        markedForReview = {};
        currentQuestion = 0;

        if(timerInterval){
            clearInterval(timerInterval);
            timerInterval = null;
        }

        startTimer();

        renderQuestion();
        renderPalette();

        alert("Test restarted successfully!");

    }catch(err){

        console.error(err);
        alert("Something went wrong while restarting the test.");

    }
}

    /* -----------------------------------------
       LOCK SUBMISSION
    ----------------------------------------- */

    submitting = true;


    clearInterval(
        timerInterval
    );


    const submitButton =
        document.querySelector(
            ".submit"
        );


    if (submitButton) {

        submitButton.disabled =
            true;


        submitButton.textContent =
            "Submitting...";

    }


    try {

        /* -----------------------------------------
           SERVER-SIDE GRADING

           The server ignores p_answers and
           grades from attempt_responses.
        ----------------------------------------- */

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "submit_test_secure",
            {
                p_attempt_id:
                    Number(attemptId),

                p_answers:
                    answers
            }
        );


        if (error) {

            console.error(
                error
            );


            submitting = false;


            if (submitButton) {

                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "Submit Test";

            }


            alert(
                "Something went wrong while submitting the test.\n\n" +
                error.message
            );


            return;

        }


        console.log(
            "Secure server result:",
            data
        );


        /* -----------------------------------------
           SAVE RESULT
        ----------------------------------------- */

        sessionStorage.setItem(
            "latestTestResult",
            JSON.stringify(data)
        );


        /* -----------------------------------------
           GO TO RESULT
        ----------------------------------------- */

        window.location.href =
            `result.html?attempt=${data.attempt_id}`;

    }

    catch (err) {

        console.error(
            err
        );


        submitting = false;


        if (submitButton) {

            submitButton.disabled =
                false;


            submitButton.textContent =
                "Submit Test";

        }


        alert(
            "Could not submit the test. Please try again."
        );

    }

}


/* =========================================================
   START APPLICATION
========================================================= */

startTest();
