<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Test | Road 2 Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    color: #111827;
}

/* =========================================================
   HEADER
========================================================= */

header {
    background: #071a3d;
    color: white;

    padding: 16px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #f5c542;
}

.timer {
    background: #f5c542;
    color: #071a3d;

    padding: 10px 16px;

    border-radius: 8px;

    font-weight: bold;

    min-width: 75px;
    text-align: center;
}

.timer.paused {
    background: #9ca3af;
    color: white;
}

/* =========================================================
   CONTAINER
========================================================= */

.container {
    max-width: 900px;

    margin: 25px auto;

    padding: 0 15px;
}

/* =========================================================
   TEST INFO
========================================================= */

.test-info {
    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-bottom: 20px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.test-info h1 {
    color: #071a3d;

    margin-bottom: 8px;
}

/* =========================================================
   QUESTION CARD
========================================================= */

.question-card {
    background: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.question-number {
    color: #777;

    margin-bottom: 12px;

    font-weight: bold;
}

.question-text {
    font-size: 20px;

    font-weight: bold;

    line-height: 1.5;

    margin-bottom: 25px;
}

/* =========================================================
   OPTIONS
========================================================= */

.option {
    display: block;

    border: 2px solid #ddd;

    padding: 15px;

    border-radius: 10px;

    margin-bottom: 12px;

    cursor: pointer;

    transition: 0.2s;
}

.option:hover {
    border-color: #071a3d;
}

.option.selected {
    border-color: #071a3d;

    background: #eef3ff;
}

.option input {
    margin-right: 10px;
}

/* =========================================================
   SAVE STATUS
========================================================= */

.save-status {
    margin-top: 15px;

    font-size: 13px;

    color: #6b7280;

    min-height: 18px;
}

.save-status.saved {
    color: #15803d;
}

.save-status.error {
    color: #dc2626;
}

/* =========================================================
   BUTTONS
========================================================= */

.buttons {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    margin-top: 25px;

    gap: 10px;
}

button {
    border: none;

    padding: 12px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;

    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.6;

    cursor: not-allowed;

    transform: none;
}

.prev {
    background: #ddd;

    color: #111827;
}

.next {
    background: #071a3d;

    color: white;
}

.submit {
    background: #d62828;

    color: white;
}

.unattempt {
    background: #f3f4f6;

    color: #374151;

    border: 1px solid #d1d5db;
}

.unattempt:hover {
    background: #e5e7eb;
}

.review {
    background: #7c3aed;

    color: white;
}

.review.marked {
    background: #5b21b6;
}

.restart {
    background: #f3f4f6;

    color: #1f2937;

    border: 1px solid #d1d5db;
}

.restart:hover {
    background: #e5e7eb;
}

.exit {
    background: #374151;

    color: white;
}

.exit:hover {
    background: #1f2937;
}

/* =========================================================
   QUESTION PALETTE
========================================================= */

.palette-section {
    margin-top: 30px;

    padding-top: 20px;

    border-top: 1px solid #eee;
}

.palette-title {
    margin-bottom: 12px;

    font-weight: bold;

    color: #071a3d;
}

.palette {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.palette button {
    width: 40px;

    height: 40px;

    padding: 0;

    background: #eee;

    color: #111827;
}

.palette button.answered {
    background: #071a3d;

    color: white;
}

.palette button.reviewed {
    background: #7c3aed;

    color: white;
}

.palette button.answered.reviewed {
    background: linear-gradient(
        135deg,
        #071a3d 50%,
        #7c3aed 50%
    );

    color: white;
}

.palette button.current {
    outline: 3px solid #f5c542;

    outline-offset: 1px;
}

/* =========================================================
   PALETTE LEGEND
========================================================= */

.palette-info {
    display: flex;

    flex-wrap: wrap;

    gap: 14px;

    margin-top: 15px;

    font-size: 13px;

    color: #555;
}

.palette-info span {
    display: flex;

    align-items: center;

    gap: 5px;
}

.legend-box {
    width: 14px;

    height: 14px;

    border-radius: 3px;

    display: inline-block;
}

.legend-unanswered {
    background: #eee;

    border: 1px solid #ccc;
}

.legend-answered {
    background: #071a3d;
}

.legend-review {
    background: #7c3aed;
}

.legend-both {
    background: linear-gradient(
        135deg,
        #071a3d 50%,
        #7c3aed 50%
    );
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    text-align: center;

    padding: 50px;

    font-size: 20px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    header {
        padding: 13px 15px;
    }

    .logo {
        font-size: 17px;
    }

    .timer {
        padding: 8px 10px;

        font-size: 14px;
    }

    .container {
        margin: 15px auto;

        padding: 0 10px;
    }

    .question-card {
        padding: 18px;
    }

    .question-text {
        font-size: 17px;
    }

    .buttons {
        display: grid;

        grid-template-columns:
            1fr 1fr;

        width: 100%;
    }

    .buttons button {
        width: 100%;
    }

    .submit,
    .exit {
        grid-column: 1 / -1;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        ROAD 2 ACADEMY
    </div>

    <div
        class="timer"
        id="timer"
    >
        --:--
    </div>

</header>


<div class="container">


    <div
        id="loading"
        class="loading"
    >
        Loading test...
    </div>


    <div
        id="testArea"
        style="display:none;"
    >


        <div class="test-info">

            <h1 id="testTitle">
                Test
            </h1>

            <p id="testDescription"></p>

        </div>


        <div class="question-card">


            <div
                class="question-number"
                id="questionNumber"
            ></div>


            <div
                class="question-text"
                id="questionText"
            ></div>


            <div id="options"></div>


            <div
                class="save-status"
                id="saveStatus"
            ></div>


            <!-- =================================================
                 NAVIGATION BUTTONS
            ================================================= -->

            <div class="buttons">

                <button
                    class="prev"
                    onclick="previousQuestion()"
                >
                    ← Previous
                </button>


                <button
                    class="unattempt"
                    id="unattemptButton"
                    onclick="unattemptQuestion()"
                >
                    Clear Answer
                </button>


                <button
                    class="review"
                    id="reviewButton"
                    onclick="toggleReview()"
                >
                    🔖 Mark for Review
                </button>


                <button
                    class="next"
                    id="nextButton"
                    onclick="nextQuestion()"
                >
                    Next →
                </button>


                <button
                    class="restart"
                    onclick="restartTest()"
                >
                    Restart Test
                </button>


                <button
                    class="exit"
                    onclick="exitTest()"
                >
                    🚪 Exit & Save
                </button>


                <button
                    class="submit"
                    onclick="submitTest()"
                >
                    Submit Test
                </button>

            </div>


            <!-- =================================================
                 QUESTION PALETTE
            ================================================= -->

            <div class="palette-section">

                <div class="palette-title">
                    Question Palette
                </div>


                <div
                    class="palette"
                    id="palette"
                ></div>


                <div class="palette-info">

                    <span>
                        <span
                            class="legend-box legend-unanswered"
                        ></span>
                        Unanswered
                    </span>


                    <span>
                        <span
                            class="legend-box legend-answered"
                        ></span>
                        Answered
                    </span>


                    <span>
                        <span
                            class="legend-box legend-review"
                        ></span>
                        Review
                    </span>


                    <span>
                        <span
                            class="legend-box legend-both"
                        ></span>
                        Answered + Review
                    </span>

                </div>

            </div>


        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://egjrkxdyehwbzgoppiqk.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_nc_Xv85AMQrmgIlDEWD8CA_aSeMk-yv";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let test = null;

let questions = [];

let currentQuestion = 0;

let answers = {};

let markedForReview = {};

let attemptId = null;

let serverStartedAt = null;

let remainingSeconds = 0;

let durationSeconds = 0;

let timerInterval = null;

let submitting = false;

let paused = false;

let pausing = false;


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const testId =
    params.get("test") || "1";


/* =========================================================
   START
========================================================= */

async function startTest() {

    try {

        const {
            data: {
                session
            }
        } =
        await supabaseClient.auth.getSession();


        if (!session) {

            window.location.href =
                "login.html";

            return;

        }


        await loadTest();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "loading"
        ).textContent =
            "Unable to start test.";

    }

}


/* =========================================================
   LOAD TEST
========================================================= */

async function loadTest() {

    /* -----------------------------------------
       LOAD TEST
    ----------------------------------------- */

    const {
        data: testData,
        error: testError
    } =
    await supabaseClient
        .from("tests")
        .select("*")
        .eq("id", testId)
        .eq("is_published", true)
        .single();


    if (testError) {

        console.error(testError);

        document.getElementById(
            "loading"
        ).textContent =
            "Unable to load test.";

        return;

    }


    test = testData;


    /* -----------------------------------------
       LOAD PUBLIC QUESTIONS
    ----------------------------------------- */

    const {
        data: questionData,
        error: questionError
    } =
    await supabaseClient
        .from("test_questions_public")
        .select("*")
        .eq("test_id", testId)
        .order(
            "question_number",
            {
                ascending: true
            }
        );


    if (questionError) {

        console.error(questionError);

        document.getElementById(
            "loading"
        ).textContent =
            "Unable to load questions.";

        return;

    }


    questions =
        questionData || [];


    if (questions.length === 0) {

        document.getElementById(
            "loading"
        ).textContent =
            "This test has no questions yet.";

        return;

    }


    /* -----------------------------------------
       TEST INFORMATION
    ----------------------------------------- */

    document.getElementById(
        "testTitle"
    ).textContent =
        test.title;


    document.getElementById(
        "testDescription"
    ).textContent =
        test.description || "";


    /* -----------------------------------------
       START / RESUME ATTEMPT
    ----------------------------------------- */

    const {
        data: attemptData,
        error: attemptError
    } =
    await supabaseClient.rpc(
        "start_test_attempt",
        {
            p_test_id:
                Number(testId)
        }
    );


    if (attemptError) {

        console.error(attemptError);

        document.getElementById(
            "loading"
        ).innerHTML =
            "Unable to start test.<br><br>" +
            escapeHtml(
                attemptError.message
            );

        return;

    }


    console.log(
        "Server attempt:",
        attemptData
    );


    attemptId =
        attemptData.attempt_id;


    durationSeconds =
        Number(
            attemptData.duration_minutes
        ) * 60;


    remainingSeconds =
        Number(
            attemptData.remaining_seconds
        );


    paused =
        attemptData.is_paused === true;


    serverStartedAt =
        attemptData.started_at
            ? new Date(
                attemptData.started_at
              ).getTime()
            : Date.now();


    /* -----------------------------------------
       LOAD SAVED ANSWERS
    ----------------------------------------- */

    await loadSavedAnswers();


    /* -----------------------------------------
       SHOW TEST
    ----------------------------------------- */

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "testArea"
    ).style.display =
        "block";


    renderQuestion();


    /* -----------------------------------------
       TIMER
    ----------------------------------------- */

    if (paused) {

        showPausedTimer();

    }

    else {

        startTimer();

    }

}


/* =========================================================
   LOAD SAVED ANSWERS
========================================================= */

async function loadSavedAnswers() {

    try {

        setSaveStatus(
            "Restoring saved answers..."
        );


        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "get_attempt_responses",
            {
                p_attempt_id:
                    Number(attemptId)
            }
        );


        if (error) {

            console.error(
                "Load answers error:",
                error
            );

            setSaveStatus(
                "Could not restore saved answers.",
                "error"
            );

            return;

        }


        if (
            data &&
            typeof data === "object"
        ) {

            answers = data;

        }

        else {

            answers = {};

        }


        const savedCount =
            questions.filter(
                q =>
                    answers[q.id]
            ).length;


        if (
            savedCount > 0
        ) {

            setSaveStatus(
                `${savedCount} answer(s) restored.`,
                "saved"
            );

        }

        else {

            setSaveStatus(
                "Answers will be saved automatically."
            );

        }

    }

    catch (error) {

        console.error(error);

        setSaveStatus(
            "Could not restore saved answers.",
            "error"
        );

    }

}


/* =========================================================
   SAVE ANSWER
========================================================= */

async function saveAnswer(
    questionId,
    selectedAnswer
) {

    if (
        !attemptId ||
        submitting
    ) {

        return false;

    }


    setSaveStatus(
        "Saving..."
    );


    try {

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "save_attempt_answer",
            {
                p_attempt_id:
                    Number(attemptId),

                p_question_id:
                    Number(questionId),

                p_selected_answer:
                    selectedAnswer
            }
        );


        if (error) {

            console.error(
                "Save answer error:",
                error
            );

            setSaveStatus(
                "Could not save answer.",
                "error"
            );

            return false;

        }


        setSaveStatus(
            "✓ Answer saved",
            "saved"
        );


        return true;

    }

    catch (error) {

        console.error(error);

        setSaveStatus(
            "Could not save answer.",
            "error"
        );

        return false;

    }

}


/* =========================================================
   SAVE STATUS
========================================================= */

function setSaveStatus(
    message,
    type = ""
) {

    const element =
        document.getElementById(
            "saveStatus"
        );


    element.textContent =
        message;


    element.className =
        "save-status";


    if (type) {

        element.classList.add(
            type
        );

    }

}


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion() {

    const q =
        questions[currentQuestion];


    if (!q) {

        return;

    }


    document.getElementById(
        "questionNumber"
    ).textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;


    document.getElementById(
        "questionText"
    ).textContent =
        q.question_text;


    const optionsContainer =
        document.getElementById(
            "options"
        );


    optionsContainer.innerHTML =
        "";


    const options = [

        ["A", q.option_a],

        ["B", q.option_b],

        ["C", q.option_c],

        ["D", q.option_d]

    ];


    options.forEach(
        ([letter, text]) => {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "option";


            if (
                answers[q.id] === letter
            ) {

                label.classList.add(
                    "selected"
                );

            }


            label.innerHTML = `

                <input
                    type="radio"
                    name="answer"
                    value="${letter}"
                    ${
                        answers[q.id] === letter
                        ? "checked"
                        : ""
                    }
                >

                <strong>
                    ${letter}.
                </strong>

                ${escapeHtml(text)}

            `;


            label
                .querySelector("input")
                .addEventListener(
                    "change",
                    async function() {

                        const selected =
                            this.value;


                        answers[q.id] =
                            selected;


                        renderQuestion();


                        await saveAnswer(
                            q.id,
                            selected
                        );

                    }
                );


            optionsContainer
                .appendChild(label);

        }
    );


    const reviewButton =
        document.getElementById(
            "reviewButton"
        );


    if (
        markedForReview[q.id]
    ) {

        reviewButton.textContent =
            "🔖 Remove Review";

        reviewButton.classList.add(
            "marked"
        );

    }

    else {

        reviewButton.textContent =
            "🔖 Mark for Review";

        reviewButton.classList.remove(
            "marked"
        );

    }


    const unattemptButton =
        document.getElementById(
            "unattemptButton"
        );


    unattemptButton.disabled =
        !answers[q.id];


    updateButtons();

    renderPalette();

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   CLEAR ANSWER
========================================================= */

async function unattemptQuestion() {

    const q =
        questions[currentQuestion];


    if (
        !q ||
        submitting ||
        paused
    ) {

        return;

    }


    if (
        !answers[q.id]
    ) {

        return;

    }


    delete answers[q.id];


    renderQuestion();


    await saveAnswer(
        q.id,
        ""
    );

}


/* =========================================================
   MARK FOR REVIEW
========================================================= */

function toggleReview() {

    const q =
        questions[currentQuestion];


    if (
        !q ||
        paused
    ) {

        return;

    }


    if (
        markedForReview[q.id]
    ) {

        delete markedForReview[q.id];

    }

    else {

        markedForReview[q.id] =
            true;

    }


    renderQuestion();

}


/* =========================================================
   BUTTONS
========================================================= */

function updateButtons() {

    const nextButton =
        document.getElementById(
            "nextButton"
        );


    const prevButton =
        document.querySelector(
            ".prev"
        );


    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.style.display =
            "none";

    }

    else {

        nextButton.style.display =
            "block";

    }


    prevButton.disabled =
        currentQuestion === 0 ||
        paused;

}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion() {

    if (
        paused
    ) {

        return;

    }


    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        renderQuestion();

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousQuestion() {

    if (
        paused
    ) {

        return;

    }


    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        renderQuestion();

    }

}


/* =========================================================
   QUESTION PALETTE
========================================================= */

function renderPalette() {

    const palette =
        document.getElementById(
            "palette"
        );


    palette.innerHTML =
        "";


    questions.forEach(
        (q, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                index + 1;


            if (
                answers[q.id]
            ) {

                button.classList.add(
                    "answered"
                );

            }


            if (
                markedForReview[q.id]
            ) {

                button.classList.add(
                    "reviewed"
                );

            }


            if (
                index === currentQuestion
            ) {

                button.classList.add(
                    "current"
                );

            }


            button.disabled =
                paused;


            button.onclick =
                function() {

                    if (paused) {
                        return;
                    }

                    currentQuestion =
                        index;

                    renderQuestion();

                };


            palette.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    if (paused) {
        return;
    }


    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            1000
        );

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer() {

    if (
        paused ||
        !attemptId
    ) {

        return;

    }


    const now =
        Date.now();


    const elapsedSeconds =
        Math.floor(
            (
                now -
                serverStartedAt
            ) / 1000
        );


    const remaining =
        Math.max(
            0,
            remainingSeconds -
            elapsedSeconds
        );


    const minutes =
        Math.floor(
            remaining / 60
        );


    const seconds =
        remaining % 60;


    document.getElementById(
        "timer"
    ).textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;


    if (
        remaining <= 0 &&
        !submitting
    ) {

        clearInterval(
            timerInterval
        );


        alert(
            "Time is up! Your test will be submitted."
        );


        submitTest(true);

    }

}


/* =========================================================
   PAUSE TEST
========================================================= */

async function pauseTest(
    silent = false
) {

    if (
        !attemptId ||
        submitting ||
        paused ||
        pausing
    ) {

        return false;

    }


    pausing = true;


    try {

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "pause_test_attempt",
            {
                p_attempt_id:
                    Number(attemptId)
            }
        );


        if (error) {

            console.error(
                "Pause error:",
                error
            );

            pausing = false;

            if (!silent) {

                alert(
                    "Could not pause the test.\n\n" +
                    error.message
                );

            }

            return false;

        }


        remainingSeconds =
            Number(
                data.remaining_seconds
            );


        paused = true;


        if (timerInterval) {

            clearInterval(
                timerInterval
            );

            timerInterval = null;

        }


        showPausedTimer();


        setSaveStatus(
            "Test paused. Your answers are saved.",
            "saved"
        );


        updateButtons();


        pausing = false;


        return true;

    }

    catch (error) {

        console.error(
            "Pause exception:",
            error
        );

        pausing = false;

        return false;

    }

}


/* =========================================================
   RESUME TEST
========================================================= */

async function resumeTest() {

    if (
        !attemptId ||
        !paused
    ) {

        return;

    }


    try {

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "resume_test_attempt",
            {
                p_attempt_id:
                    Number(attemptId)
            }
        );


        if (error) {

            console.error(
                "Resume error:",
                error
            );

            alert(
                "Could not resume the test.\n\n" +
                error.message
            );

            return;

        }


        remainingSeconds =
            Number(
                data.remaining_seconds
            );


        serverStartedAt =
            new Date(
                data.started_at
            ).getTime();


        paused = false;


        startTimer();


        updateButtons();


        setSaveStatus(
            "Test resumed.",
            "saved"
        );


        renderQuestion();

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not resume the test."
        );

    }

}


/* =========================================================
   SHOW PAUSED TIMER
========================================================= */

function showPausedTimer() {

    const timer =
        document.getElementById(
            "timer"
        );


    const minutes =
        Math.floor(
            remainingSeconds / 60
        );


    const seconds =
        remainingSeconds % 60;


    timer.textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;


    timer.classList.add(
        "paused"
    );


    const saveStatus =
        document.getElementById(
            "saveStatus"
        );


    saveStatus.innerHTML =
        `
        <strong>Test paused.</strong>
        <br>
        ${formatTime(remainingSeconds)}
        remaining.
        <br><br>
        <button
            type="button"
            onclick="resumeTest()"
            style="
                background:#071a3d;
                color:white;
                padding:10px 16px;
                border-radius:8px;
                border:none;
                cursor:pointer;
                font-weight:bold;
            "
        >
            ▶ Resume Test
        </button>
        `;

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


/* =========================================================
   EXIT & SAVE
========================================================= */

async function exitTest() {

    if (
        submitting
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Exit this test?\n\n" +
            "Your answers will be saved and the timer will pause. " +
            "You can resume later from the same remaining time."
        );


    if (!confirmed) {

        return;

    }


    const pausedSuccessfully =
        await pauseTest(false);


    if (!pausedSuccessfully) {

        return;

    }


    window.location.href =
        "tests.html";

}


/* =========================================================
   RESTART TEST
========================================================= */

async function restartTest() {

    if (
        !attemptId ||
        submitting
    ) {

        alert(
            "No active test attempt found."
        );

        return;

    }


    const confirmed =
        confirm(
            "Restart this test?\n\n" +
            "Your current attempt and saved answers " +
            "will be deleted and a fresh attempt will start."
        );


    if (!confirmed) {

        return;

    }


    try {

        if (timerInterval) {

            clearInterval(
                timerInterval
            );

            timerInterval = null;

        }


        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "restart_test_attempt",
            {
                p_attempt_id:
                    Number(attemptId)
            }
        );


        if (error) {

            console.error(
                "Restart error:",
                error
            );

            alert(
                "Restart failed.\n\n" +
                error.message
            );

            return;

        }


        attemptId =
            data.attempt_id;


        serverStartedAt =
            new Date(
                data.started_at
            ).getTime();


        durationSeconds =
            Number(
                data.duration_minutes
            ) * 60;


        remainingSeconds =
            Number(
                data.remaining_seconds
            );


        answers = {};

        markedForReview = {};

        currentQuestion = 0;

        submitting = false;

        paused = false;

        pausing = false;


        const timer =
            document.getElementById(
                "timer"
            );


        timer.classList.remove(
            "paused"
        );


        setSaveStatus(
            "New attempt started.",
            "saved"
        );


        renderQuestion();

        startTimer();


        alert(
            "Test restarted successfully!"
        );

    }

    catch (error) {

        console.error(
            "Restart exception:",
            error
        );

        alert(
            "Restart failed.\n\n" +
            (error.message || error)
        );

    }

}


/* =========================================================
   BEST-EFFORT AUTO PAUSE WHEN PAGE EXITS
========================================================= */

window.addEventListener(
    "pagehide",
    async function() {

        if (
            !attemptId ||
            submitting ||
            paused ||
            pausing
        ) {

            return;

        }


        try {

            const {
                data: {
                    session
                }
            } =
            await supabaseClient.auth.getSession();


            if (
                !session ||
                !session.access_token
            ) {

                return;

            }


            /*
             * Use fetch(... keepalive) because normal async
             * JavaScript may be terminated when the page closes.
             */

            fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/pause_test_attempt",
                {

                    method: "POST",

                    keepalive: true,

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            session.access_token

                    },

                    body:
                        JSON.stringify({
                            p_attempt_id:
                                Number(attemptId)
                        })

                }
            );

        }

        catch (error) {

            console.warn(
                "Automatic pause could not be sent:",
                error
            );

        }

    }
);


/* =========================================================
   SUBMIT TEST
========================================================= */

async function submitTest(
    autoSubmit = false
) {

    if (
        submitting
    ) {

        return;

    }


    if (
        !autoSubmit
    ) {

        const answered =
            questions.filter(
                q =>
                    answers[q.id]
            ).length;


        const unanswered =
            questions.length -
            answered;


        const reviewed =
            questions.filter(
                q =>
                    markedForReview[q.id]
            ).length;


        const confirmSubmit =
            confirm(
                `Submit test?\n\n` +

                `Answered: ${answered}\n` +

                `Unanswered: ${unanswered}\n` +

                `Marked for Review: ${reviewed}`
            );


        if (!confirmSubmit) {

            return;

        }

    }


    submitting = true;


    if (timerInterval) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;

    }


    const submitButton =
        document.querySelector(
            ".submit"
        );


    if (submitButton) {

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Submitting...";

    }


    try {

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "submit_test_secure",
            {
                p_attempt_id:
                    Number(attemptId),

                p_answers:
                    answers
            }
        );


        if (error) {

            console.error(
                error
            );


            submitting = false;


            if (submitButton) {

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Submit Test";

            }


            alert(
                "Something went wrong while submitting the test.\n\n" +
                error.message
            );


            return;

        }


        console.log(
            "Secure server result:",
            data
        );


        sessionStorage.setItem(
            "latestTestResult",
            JSON.stringify(data)
        );


        window.location.href =
            `result.html?attempt=${data.attempt_id}`;

    }

    catch (err) {

        console.error(
            err
        );


        submitting = false;


        if (submitButton) {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Submit Test";

        }


        alert(
            "Could not submit the test. Please try again."
        );

    }

}


/* =========================================================
   START APPLICATION
========================================================= */

startTest();

</script>
