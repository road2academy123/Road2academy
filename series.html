
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Series | Road to Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f6fb;
  color:#182338;
  font-family:Arial,sans-serif;
}

header{
  background:linear-gradient(135deg,#13233f,#203d6d);
  color:white;
  padding:20px;
  box-shadow:0 3px 12px rgba(19,35,63,.12);
}

header h1{margin-top:0;margin-bottom:8px}
header p{margin-bottom:0;color:#d8e4fa}

main{
  max-width:900px;
  margin:22px auto;
  padding:0 14px;
}

.card{
  background:white;
  border:1px solid #e0e6ef;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
}

input,button{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #cbd5e1;
  font:inherit;
  margin:5px 0;
}

input:focus{
  outline:none;
  border-color:#3976ed;
  box-shadow:0 0 0 3px rgba(57,118,237,.12);
}

button{
  background:linear-gradient(135deg,#245bd5,#3979ee);
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(36,91,213,.18);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}

button:hover{
  filter:brightness(1.06);
  box-shadow:0 5px 13px rgba(36,91,213,.25);
  transform:translateY(-1px);
}

button:active{transform:scale(.98)}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.series-card{
  background:#fff;
  border:1px solid #e0e6ef;
  border-radius:14px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 3px 12px rgba(24,35,56,.035);
  transition:border-color .2s ease,box-shadow .2s ease;
}

.series-card:hover{
  border-color:#c3d5fa;
  box-shadow:0 6px 18px rgba(24,35,56,.07);
}

.test{
  padding:12px 0;
  border-top:1px solid #e3e8ef;
}

.test a{
  color:#245bd5;
  font-weight:bold;
  text-decoration:none;
}

.test a:hover{text-decoration:underline}

.small{
  font-size:13px;
  color:#65738a;
  line-height:1.6;
}

.status{
  white-space:pre-wrap;
  color:#9a2525;
  font-size:14px;
  line-height:1.6;
}

.pill{
  display:inline-flex;
  align-items:center;
  padding:6px 11px;
  border-radius:30px;
  background:#fff0d5;
  color:#915b00;
  font-size:11px;
  font-weight:bold;
  letter-spacing:.4px;
}

.pill.unlocked{
  background:#dcfce7;
  color:#166534;
}

.details-link{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:13px 16px;
  margin:13px 0;
  background:linear-gradient(135deg,#13233f,#245bd5);
  color:white;
  text-align:center;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  font-size:14px;
  box-shadow:0 3px 9px rgba(19,35,63,.13);
  transition:transform .18s ease,box-shadow .18s ease;
}

.details-link:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(19,35,63,.2);
}

.details-link:active{transform:scale(.98)}

.price{
  font-size:16px;
  color:#172b4d;
}

.section-title{margin-top:0}

@media(min-width:600px){
  .details-link{width:auto;min-width:210px}
}
</style>
</head>

<body>
<header>
  <h1>ROAD TO ACADEMY</h1>
  <p>Test Series — NDA / CDS / CAPF</p>
</header>

<main>
  <section class="card">
    <h2 class="section-title">Redeem Your Series Code</h2>
    <p class="small">Sign in first. Enter the access code provided by the Road to Academy admin.</p>
    <input id="code" placeholder="Example: RA-SER-XXXXXXXXXXXX" autocomplete="off">
    <button id="redeemBtn">🔓 Redeem Code</button>
    <div id="status" class="status"></div>
  </section>

  <section class="card">
    <h2 class="section-title">Available Test Series</h2>
    <div id="seriesList">Loading series...</div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://egjrkxdyehwbzgoppiqk.supabase.co";
const SUPABASE_KEY = "sb_publishable_nc_Xv85AMQrmgIlDEWD8CA_aSeMk-yv";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const say = msg => $("status").textContent = msg;

let user = null;
let redeeming = false;

function safe(text) {
  return String(text ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function init() {
  const {data:{session}, error} = await db.auth.getSession();

  if(error || !session) {
    $("seriesList").textContent = "Please sign in to view your series.";
    say("You need to sign in before redeeming a code.");
    return;
  }

  user = session.user;
  await loadSeries();
}

async function loadSeries() {
  $("seriesList").textContent = "Loading...";

  const [seriesResult, entitlementResult] = await Promise.all([
    db.from("test_series")
      .select("id,title,description,price_inr")
      .eq("is_published", true)
      .order("id", {ascending:false}),

    db.from("series_entitlements")
      .select("series_id,revoked_at")
      .eq("user_id", user.id)
  ]);

  if(seriesResult.error) {
    $("seriesList").textContent =
      "Could not load series: " + seriesResult.error.message;
    return;
  }

  if(entitlementResult.error) {
    $("seriesList").textContent =
      "Could not check access: " + entitlementResult.error.message;
    return;
  }

  const owned = new Set((entitlementResult.data || [])
    .filter(e => !e.revoked_at)
    .map(e => String(e.series_id)));

  const series = seriesResult.data || [];

  if(!series.length) {
    $("seriesList").textContent = "No published series are available yet.";
    return;
  }

  $("seriesList").innerHTML = series.map(s => `
    <article class="series-card">
      <span class="pill ${owned.has(String(s.id)) ? "unlocked" : ""}">
        ${owned.has(String(s.id)) ? "✓ UNLOCKED" : "🔒 LOCKED"}
      </span>

      <h3>${safe(s.title)}</h3>

      <p>${safe(s.description || "No description available.")}</p>

      <p class="price">
        <strong>Series Price: ₹${Number(s.price_inr || 0).toLocaleString("en-IN")}</strong>
      </p>

      <a class="details-link"
         href="series-details.html?series=${encodeURIComponent(s.id)}">
         View Series Details &nbsp; →
      </a>

      <div id="tests-${s.id}" class="small">
        Loading included tests...
      </div>
    </article>
  `).join("");

  await Promise.all(
    series.map(s => loadSeriesTests(s, owned.has(String(s.id))))
  );
}

async function loadSeriesTests(series, unlocked) {
  const target = $("tests-" + series.id);

  const {data:mappings, error} = await db
    .from("series_tests")
    .select("test_id")
    .eq("series_id", series.id);

  if(error) {
    target.textContent = "Could not load included tests.";
    return;
  }

  const ids = [...new Set((mappings || []).map(m => m.test_id))];

  if(!ids.length) {
    target.textContent = "No tests have been added to this series yet.";
    return;
  }

  const {data:tests, error:testError} = await db
    .from("tests")
    .select("id,title,exam,is_published")
    .in("id", ids)
    .eq("is_published", true);

  if(testError) {
    target.textContent = "Could not load test details.";
    return;
  }

  if(!tests || !tests.length) {
    target.textContent = "No published tests are currently available.";
    return;
  }

  target.innerHTML = `
    <strong>${tests.length} published test(s) included</strong>
    ${tests.map(t => `
      <div class="test">
        ${safe(t.title || "Test #" + t.id)}
        <div class="small">${safe(t.exam || "")}</div>
        ${unlocked
          ? `<a href="test.html?test=${encodeURIComponent(t.id)}">Open Test →</a>`
          : `<span class="small">View details to learn how to unlock this series.</span>`}
      </div>
    `).join("")}
  `;
}

$("redeemBtn").onclick = async () => {
  if(redeeming) return;

  if(!user) {
    say("Please sign in first.");
    return;
  }

  const code = $("code").value.trim();

  if(!code) {
    say("Enter your access code.");
    return;
  }

  redeeming = true;
  $("redeemBtn").disabled = true;
  say("Checking code...");

  try {
    const {data, error} = await db.rpc("redeem_series_access_code", {
      p_code: code
    });

    if(error) {
      say("Redemption failed: " + error.message);
      return;
    }

    if(data !== true) {
      say("Invalid, expired, revoked, or fully used code.");
      return;
    }

    $("code").value = "";
    say("Code accepted. Refreshing your series access...");

    await loadSeries();
    say("Code accepted. Check the series details to confirm access.");
  } catch(err) {
    say("Unexpected error: " + (err.message || String(err)));
  } finally {
    redeeming = false;
    $("redeemBtn").disabled = false;
  }
};

init();
</script>
</body>
</html>
