<!DOCTYPE html>
<html>
<head>
    <title>Supabase Connection Test</title>
</head>
<body style="background:#111;color:white;font-family:Arial;padding:30px">

<h1>Supabase Connection Test</h1>

<pre id="result">Testing...</pre>

<script>
const URL = "https://egjrkxdyehwbzgoppiq4.supabase.co";
const KEY = "sb_publishable_nc_Xv85AMQrmgIlDEWD8CA_aSeMk-yv";

async function test() {

    const result = document.getElementById("result");

    try {

        const response = await fetch(
            URL + "/rest/v1/tests?select=id,title&limit=1",
            {
                method: "GET",
                headers: {
                    "apikey": KEY,
                    "Authorization": "Bearer " + KEY
                }
            }
        );

        const text = await response.text();

        result.textContent =
            "HTTP STATUS: " + response.status +
            "\n\nRESPONSE:\n" + text;

    } catch (error) {

        result.textContent =
            "FETCH FAILED\n\n" +
            error.toString() +
            "\n\n" +
            error.message;

        console.error(error);
    }
}

test();
</script>

</body>
</html>
